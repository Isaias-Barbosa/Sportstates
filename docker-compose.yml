# Opcional: desenvolvimento com uma REST API Transfermarkt independente.
# A implantação padrão da Vercel usa o SDK Python e não precisa de Docker.
# Depois de iniciar: TRANSFERMARKT_API_URL=http://localhost:8000
services:
  transfermarkt-api:
    build:
      context: https://github.com/felipeall/transfermarkt-api.git#main
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    environment:
      CACHE_TTL_SECONDS: "3600"
      TFMKT_MAX_CONCURRENCY: "3"
